<section class="welcome-hero" id="home" aria-labelledby="welcomeTitle">
    <video class="welcome-background-video" id="welcomeBackgroundVideo" autoplay muted loop playsinline
           preload="auto"
           aria-hidden="true" hidden></video>
    <div class="welcome-embed" id="welcomeEmbed" aria-hidden="true"></div>
    <div class="welcome-scrim" aria-hidden="true"></div>
    <div class="welcome-content" dir="{{ current_language_direction }}">
        <span class="welcome-eyebrow"><span aria-hidden="true">✦</span>{{ t.hero_system_label }}</span>
        <h1 id="welcomeTitle">{{ t.hero_title_lead }}<br><span class="welcome-title-accent">{{ t.hero_title_accent }}</span><br>{{ t.hero_title_end }}</h1>
        <p class="welcome-description">{{ t.hero_description }}</p>
        <div class="welcome-actions">
            {% if current_user.is_authenticated %}
                <a class="welcome-action-primary" href="{{ url_for('scanner') }}">{{ t.hero_primary_cta }}<span aria-hidden="true">→</span></a>
            {% else %}
                <a class="welcome-action-primary" href="{{ url_for('register') }}">{{ t.hero_primary_cta }}<span aria-hidden="true">→</span></a>
            {% endif %}
            <a class="welcome-action-secondary" href="#services">{{ t.hero_secondary_cta }}</a>
        </div>
    </div>
    <div class="welcome-media-controls">
        <p class="welcome-background-status" id="welcomeBackgroundStatus" role="status" aria-live="polite"
           data-message-unconfigured="{{ t.animation_not_configured }}"
           data-message-unavailable="{{ t.animation_unavailable }}"></p>
        <button class="welcome-sound-button" id="welcomeSoundToggle" type="button" hidden
                aria-pressed="false" aria-label="{{ t.animation_sound_on }}"
                data-label-sound-on="{{ t.animation_sound_on }}"
                data-label-sound-off="{{ t.animation_sound_off }}">♫</button>
    </div>
</section>
