<header class="welcome-header" dir="ltr">
    <div class="welcome-header-top">
        <a class="welcome-brand" href="{{ url_for('home') }}" aria-label="CropFarmAI home">
            <span class="welcome-brand-mark" aria-hidden="true">C</span>
            <span class="welcome-brand-name">CropFarm<span>AI</span><small>SMART AGRICULTURE</small></span>
        </a>
        <div class="welcome-header-actions">
            <button class="home-menu-toggle" id="homeMenuToggle" type="button"
                    aria-label="Open navigation" aria-expanded="false" aria-controls="welcomeNav">☰</button>
        </div>
    </div>
    <nav class="welcome-nav" id="welcomeNav" aria-label="Main navigation">
        <div class="welcome-nav-links">
            <a href="#home" data-home-nav>Home</a>
            <a href="#services" data-home-nav>Services</a>
            <a href="#about" data-home-nav>About Us</a>
            <a href="#contact" data-home-nav>Contact Us</a>
        </div>
        <div class="welcome-nav-actions">
            <button class="welcome-language-trigger" type="button" id="openLanguageDialog">
                {{ t.language }}<span aria-hidden="true">⌄</span>
            </button>
            {% if current_user.is_authenticated %}
                <a class="welcome-nav-primary" href="{{ url_for('dashboard') }}">Open my workspace</a>
            {% else %}
                <a class="welcome-nav-login" href="{{ url_for('login') }}">Sign In</a>
                <a class="welcome-nav-primary" href="{{ url_for('register') }}">Create Account</a>
            {% endif %}
        </div>
    </nav>
</header>
